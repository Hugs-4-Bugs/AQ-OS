# AcquisitionOS — Production Prometheus configuration
# FIXED 2026-11: scrape path corrected, rule_files added, Alertmanager block added.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: acquisitionos
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'acquisitionos-app'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: /api/metrics/scrape
    bearer_token_file: /run/secrets/metrics_scrape_token
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: host

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'realtime'
    static_configs:
      - targets: ['realtime-service:3003']
    metrics_path: /metrics

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
