# AcquisitionOS — Alertmanager configuration
# Routes alerts to the AcquisitionOS ops-alerting webhook (Telegram + WhatsApp).

global:
  resolve_timeout: 5m

receivers:
  - name: 'acquisitionos-ops-webhook'
    webhook_configs:
      - url: 'http://frontend:3000/api/ops/alerts/webhook'
        send_resolved: true
        max_alerts: 50

  - name: 'acquisitionos-email-fallback'
    email_configs:
      - to: 'ops@acquisitionos.local'
        from: 'alertmanager@acquisitionos.local'
        smarthost: 'smtp:25'
        send_resolved: true
        require_tls: true

  - name: 'null'

route:
  receiver: 'acquisitionos-ops-webhook'
  group_by: ['alertname', 'severity', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: 'acquisitionos-ops-webhook'
      group_wait: 10s
      repeat_interval: 1h
      continue: true

    - matchers:
        - severity="critical"
      receiver: 'acquisitionos-email-fallback'

    - matchers:
        - severity="warning"
      receiver: 'acquisitionos-ops-webhook'
      group_wait: 60s
      repeat_interval: 4h

    - matchers:
        - severity="info"
      receiver: 'null'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'component']

  - source_matchers:
      - alertname="AppDown"
    target_matchers:
      - severity=~"warning|critical"
    equal: ['component']
