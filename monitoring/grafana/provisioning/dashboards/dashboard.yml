apiVersion: 1

providers:
  - name: 'AcquisitionOS'
    orgId: 1
    folder: 'AcquisitionOS'
    folderUid: 'acquisitionos'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/acos
      foldersFromFilesStructure: true
